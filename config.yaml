# Kalshi Market Maker Configuration
# Updated: January 2026
# Mode: Dynamic - auto-fetches active markets

# =============================================================================
# MARKET DISCOVERY
# =============================================================================
# The bot can discover markets in two ways:
#
# 1. CATEGORY (Recommended): Set 'category' to automatically find ALL markets
#    in that category. For sports betting, use "Sports" to get every game,
#    spread, and player prop currently open for trading.
#
# 2. SERIES (Legacy): Set 'series' list to fetch specific series only.
#    This requires knowing the exact series tickers in advance.

# Use category-based discovery to find ALL sports markets automatically
# This finds NFL, NBA, MLB, NHL, soccer, and any other sports markets
category: Sports

# Legacy series-based approach (uncomment to use instead of category):
# series:
#   # NFL Individual Games
#   - KXNFLGAME      # NFL Moneyline (who wins)
#   - KXNFLSPREAD    # NFL Point Spread
#   - KXNFLTOTAL     # NFL Total Points
#   # NBA Individual Games
#   - KXNBAGAME      # NBA Moneyline (who wins)
#   - KXNBATOTAL     # NBA Total Points

# =============================================================================
# TIMING SETTINGS
# =============================================================================

# How often to check for new markets (in seconds)
# New games appear throughout the day, so check every 5 minutes
refresh_interval: 300

# How long each market maker runs before recycling (in seconds)
# Set to 1 hour - markets will be re-evaluated and restarted if still active
market_duration: 3600

# Loop interval - how often to update quotes (in seconds)
dt: 2.0

# Maximum number of markets to trade simultaneously
# With $250 capital, limit concurrent markets to avoid spreading too thin
max_concurrent_markets: 10

# =============================================================================
# MARKET MAKER PARAMETERS
# =============================================================================

market_maker:
  # Position limits
  max_position: 5              # Max contracts per market
  position_limit_buffer: 0.1   # 10% buffer near limits

  # Spread settings
  min_spread: 0.04             # $0.04 minimum spread (covers fees)

  # Avellaneda-Stoikov parameters
  gamma: 0.1                   # Risk aversion (higher = wider spreads)
  k: 1.5                       # Liquidity parameter
  sigma: 0.001                 # Volatility estimate
  inventory_skew_factor: 0.001 # Inventory adjustment weight

  # Order settings
  order_expiration: 3600       # Orders expire after 1 hour
  trade_side: "yes"            # Trade on "yes" side
