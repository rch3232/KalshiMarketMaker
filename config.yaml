# Kalshi Market Maker Configuration
# Updated: January 2026
# Runtime: 1 year (31536000 seconds)
# Min spread: $0.04 to cover Kalshi fees

# Strategy 1: Fed Funds Rate - January 2026 Meeting
# Market for predicting Fed funds rate after January FOMC meeting
KXFED-26JAN:
  api:
    market_ticker: KXFED-26JAN-T425  # 4.25% rate target bracket
    trade_side: "yes"
  market_maker:
    max_position: 5
    order_expiration: 31536000  # 1 year
    gamma: 0.1
    k: 1.5
    sigma: 0.001
    T: 31536000  # 1 year
    min_spread: 0.04
    position_limit_buffer: 0.1
    inventory_skew_factor: 0.001
  dt: 2.0

